services:
  postgres:
    image: postgres:17
    container_name: subflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: subflow
      POSTGRES_PASSWORD: subflow_dev_password
      POSTGRES_DB: subflow

    ports:
      - "5432:5432"

    volumes:
      - subflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subflow -d subflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  subflow_postgres_data: